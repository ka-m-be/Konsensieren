# Veroeffentlicht die Konsens-App auf GitHub Pages. Das Werkzeug selbst braucht PHP
# und laeuft dort nicht, deshalb geht nur Konsens-App/ hinaus.
#
# Kein "Deploy from a branch": Das koennte nur das Hauptverzeichnis oder docs/
# ausliefern, und Jekyll machte aus den .md-Dateien HTML - dann faende die App
# Impressum.example.md nicht mehr. Hier geht das Verzeichnis unveraendert hinaus.
#
# Die App verlinkt das Werkzeug relativ (../, ../index.php/...), weil sie auf einem
# Server sein Unterverzeichnis ist. Auf Pages liefen diese Links ins Leere; sie
# zeigen dort auf die Installation in der Repository-Variable WERKZEUG_URL, ohne sie
# auf die Beispiel-Installation. "Quelltext" fuehrt ins Repository. Umgeschrieben
# wird nur die Kopie, der Quelltext bleibt, wie er ist.

name: App auf GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  bauen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Tests der App
        run: node Konsens-App/tools/test.js

      - id: pages
        uses: actions/configure-pages@v6

      - name: App zusammenstellen
        env:
          WERKZEUG: ${{ vars.WERKZEUG_URL || 'https://starbase-10.de/Konsens/' }}
          QUELLTEXT: ${{ github.server_url }}/${{ github.repository }}
          APP: ${{ steps.pages.outputs.base_url }}/
        run: |
          set -eu
          WERKZEUG="${WERKZEUG%/}/"
          rm -rf _site
          cp -R Konsens-App _site
          rm -rf _site/Spec _site/Impressum.md
          # Der Hinweis fuer die Adresse ohne Schraegstrich (index.html) zeigt
          # sonst auf Konsens-App/, das es auf Pages nicht gibt.
          sed -i \
            -e "s|href=\"\.\./index\.php/quelltext\"|href=\"$QUELLTEXT\"|g" \
            -e "s|href=\"\.\./index\.php/|href=\"${WERKZEUG}index.php/|g" \
            -e "s|href=\"\.\./\"|href=\"$WERKZEUG\"|g" \
            -e "s|href=\"Konsens-App/\"|href=\"$APP\"|g" \
            _site/*.html
          # Ein neuer Link nach oben, den die Ersetzungen nicht kennen, soll
          # auffallen, statt auf Pages still ins Leere zu fuehren.
          if grep -n 'href="\.\./' _site/*.html; then
            echo "Links ins Werkzeug, die auf Pages ins Leere liefen (siehe oben)" >&2
            exit 1
          fi

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  veroeffentlichen:
    needs: bauen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
